name: Noosa First Automation
on: [push, mirror_update, workflow_dispatch]

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Greet Riko
        run: |
          echo "Halo Riko!"
          echo "Server Noosa lagi nge-build project kamu secara otomatis nih."

      - name: Send Notification
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 *Deployment Report - Noosa Server*
            
            Project: ${{ github.repository }}
            Status: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}
            Commit: ${{ github.sha }}
            
            Gimana Riko? Aman ya!