name: Noosa First Automation
on: [push]

jobs:
  hello-world:
    runs-on: ubuntu-latest # Atau label yang kamu set tadi
    steps:
      - name: Greet Riko
        run: |
          echo "Halo System Analyst Riko!"
          echo "Server Noosa lagi nge-build project kamu secara otomatis nih."
      - name: Check Environment
        run: |
          docker --version
          node -v
      - name: Send Notification
              uses: appleboy/telegram-action@master
              if: always() # Biar tetep ngirim notif mau sukses atau gagal
              with:
                to: ${{ secrets.TELEGRAM_TO }}
                token: ${{ secrets.TELEGRAM_TOKEN }}
                message: |
                  🚀 *Deployment Report - Noosa Server*
                  
                  Project: ${{ github.repository }}
                  Status: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}
                  Commit: ${{ github.sha }}
                  Pusher: ${{ github.actor }}
                  
                  Lihat Detailnya disini: ${{ github.server_url }}/${{ github.repository }}/actions
    