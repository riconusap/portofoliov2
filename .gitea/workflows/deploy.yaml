name: Deploy Portofolio
on: [push, mirror_update, workflow_dispatch]

jobs:
  deploy-noosa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            # cd /DATA/AppData/gitea/data/gitea/repositories/riko/portofoliov2.git # Sesuaikan folder repo kamu di server
            # Atau kalau kamu sudah mirror ke folder tertentu:
            cd /apps/portfolio 
            docker compose down
            docker compose up -d --build

      - name: Send Notification
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 *Deployment Portofolio v2*
            Status: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}
            URL: rikonusa.cloud