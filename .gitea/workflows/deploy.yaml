name: Deploy Portofolio
on: [push, mirror_update, workflow_dispatch]

jobs:
  deploy-noosa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd /home/riconusap/apps/portfolio 
            git remote set-url origin http://${{ secrets.GIT_TOKEN }}@git.rikonusa.cloud/riconusap/portofoliov2.git
            git pull origin main
            docker compose down && docker compose up -d --build

      - name: Send Notification
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ${{ job.status == 'success' && '✅ *DEPLOYMENT SUCCESS*' || '❌ *DEPLOYMENT FAILED*' }}
            
            *Project:* `${{ github.repository }}`
            *Branch:* `${{ github.ref_name }}`
            *Server:* `Noosa Pentium N3700`
            
            ---
            *Commit Info:*
            `"${{ github.event.head_commit.message }}"`
            _by ${{ github.actor }}_
            
            *Link:* [rikonusa.cloud](https://rikonusa.cloud)
            *Action Logs:* [View Detail](${{ github.server_url }}/${{ github.repository }}/actions)